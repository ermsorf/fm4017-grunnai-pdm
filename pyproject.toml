[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grunnai-pdm"
version = "0.1.0"
description = "Vibration prediction project"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "xgboost>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
